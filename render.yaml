services:
  - type: web
    name: yangslots-demo
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    envVars:
      - key: YANGSLOTS_SECURE_COOKIE
        value: 'true'
      - key: YANGSLOTS_DB
        value: 'jdbc:h2:mem:yangslots-demo;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000;DATABASE_TO_UPPER=FALSE'
